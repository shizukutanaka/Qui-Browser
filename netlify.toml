# Netlify Configuration for Qui Browser VR
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # vite で dist/ をビルドして配信（生ソースを出すとベア指定子で壊れる）
  publish = "dist"
  command = "npm run build"

# Service Worker用のヘッダー設定（immutable キャッシュに捕まえない）
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Vite のハッシュ付きバンドルアセット（JS/CSS/画像）は長期キャッシュ可
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# manifest.json用の設定
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

# 全パス共通のセキュリティヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS強制（Netlifyは自動的にHTTPSを提供）
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'self';"

    # その他のセキュリティヘッダー
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions Policy（WebXR用）
    Permissions-Policy = "accelerometer=*, camera=*, gyroscope=*, magnetometer=*, microphone=*, xr-spatial-tracking=*"

# HTML用のキャッシュ設定
# （固有 Permissions-Policy をここに置くと /* の WebXR 許可を上書きするので置かない）
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# SPA用のリダイレクト設定
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200
