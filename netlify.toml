# Netlify Configuration for Qui Browser VR
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Vite の出力を公開する。以前は publish="." かつ command="echo ..." で、
  # **ビルドされていないソースをそのまま配信**していた（src/ は bare specifier
  # の ESM なのでブラウザでは動かない）。デプロイ先で必ず壊れる設定だった。
  publish = "dist"
  # The deploy runs the FULL gate, not just a build: tests, lint, build and the
  # three browser harnesses. `.github/workflows/**` cannot be repaired from
  # here (see docs/PUBLISHING.md — the token has no `workflows` permission and
  # five workflows still reference paths deleted in Session 74), so this is the
  # one deployment path whose checks actually run. A red gate fails the deploy.
  command = "npm ci && npm run gate"

# Service Worker用のヘッダー設定。canonical な worker は service-worker.js
# ひとつだけ（src/main.js が登録するのはこれ）。/sw.js と /public/sw.js を
# 指していた旧設定は、どのページも読み込まない第二の worker 向けだった。
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# JavaScript/CSS用のキャッシュ設定
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

# HTML用のキャッシュ設定
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# 画像/アイコン用のキャッシュ設定
[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# manifest.json用の設定
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

# Reader proxy (netlify/functions/reader.js) — never cached: it returns other
# sites' markup, keyed only by a query parameter.
[[headers]]
  for = "/api/reader*"
  [headers.values]
    Cache-Control = "no-store"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# WebXR用のセキュリティヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS強制（Netlifyは自動的にHTTPSを提供）
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'self';"

    # その他のセキュリティヘッダー
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions Policy（WebXR用）
    Permissions-Policy = "accelerometer=*, camera=*, gyroscope=*, magnetometer=*, microphone=*, xr-spatial-tracking=*"

# SPA用のリダイレクト設定（将来のルーティング用）
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# 404ページ
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# リダイレクト（HTTPからHTTPS）
[[redirects]]
  from = "http://:splat"
  to = "https://:splat"
  status = 301
  force = true

# 環境変数（オプション）
[context.production.environment]
  NODE_ENV = "production"
  VR_BROWSER_VERSION = "2.0.0"

[context.deploy-preview.environment]
  NODE_ENV = "staging"

# ビルド最適化
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false  # 既にモジュール化されているため
  minify = false  # 必要に応じて手動で最小化

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# 開発サーバー設定
[dev]
  command = "npm run dev"
  targetPort = 3000
