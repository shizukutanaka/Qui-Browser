# Netlify Configuration for Qui Browser VR
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Vite emits the deployable app to dist/ (cd.yml deploys the same dir)
  publish = "dist"
  command = "npm run build"

# Service Worker用のヘッダー設定（src/main.js が /service-worker.js を登録）
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Vite のハッシュ付きバンドル・静的アセット（/assets/*）は immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML用のキャッシュ設定
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# manifest.json用の設定
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

# WebXR用のセキュリティヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    # HTTPS強制（Netlifyは自動的にHTTPSを提供）
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'self';"

    # その他のセキュリティヘッダー
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions Policy（WebXR・音声入力が必要なため全ページで許可）
    Permissions-Policy = "accelerometer=*, camera=*, gyroscope=*, magnetometer=*, microphone=*, xr-spatial-tracking=*"

# 404ページ（未一致パスはアプリシェルを404で返す — SPAルーティングは存在しない）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# プラグイン設定
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # Lighthouseのしきい値設定
  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 1.0
    best-practices = 0.9
    seo = 0.9

[[plugins]]
  package = "netlify-plugin-checklinks"

  [plugins.inputs]
    # リンク切れチェック
    skipPatterns = ["#", "mailto:"]

# 環境変数（オプション）
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "staging"

# ビルド最適化
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false  # 既にモジュール化されているため
  minify = false  # 必要に応じて手動で最小化

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# 開発サーバー設定（vite dev をプロキシ）
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = true
