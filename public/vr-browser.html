<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; font-src 'self' data:; worker-src 'self'">
  <title>Qui VR Browser - WebXR Optimized</title>
  <meta name="description" content="High-performance VR browser optimized for Meta Quest and Pico devices">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    #ui-overlay {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 600px;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    #enter-vr-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: 3px solid white;
      color: white;
      font-size: 1.5rem;
      padding: 1rem 3rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    #enter-vr-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    #enter-vr-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 2rem;
      font-size: 1rem;
      opacity: 0.8;
    }

    .features {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      font-size: 0.9rem;
    }

    .feature {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
      border-radius: 10px;
    }

    .feature-icon {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    #performance-stats {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      display: none;
      z-index: 100;
    }

    .stat-line {
      margin: 2px 0;
    }

    #url-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 30px;
      display: none;
      z-index: 100;
    }

    #url-input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #url-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>

    <div id="ui-overlay">
      <h1>🥽 Qui VR Browser</h1>
      <p class="subtitle">WebXR-Optimized Browser for VR Devices</p>

      <button id="enter-vr-btn">Enter VR</button>

      <div id="status">Checking VR support...</div>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">⚡</div>
          <div>90/120Hz Rendering</div>
        </div>
        <div class="feature">
          <div class="feature-icon">👁️</div>
          <div>Foveated Rendering</div>
        </div>
        <div class="feature">
          <div class="feature-icon">👋</div>
          <div>Hand Tracking</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🎯</div>
          <div>Eye Tracking</div>
        </div>
      </div>
    </div>

    <div id="performance-stats">
      <div class="stat-line">FPS: <span id="fps">0</span></div>
      <div class="stat-line">Frame Time: <span id="frame-time">0</span>ms</div>
      <div class="stat-line">GPU: <span id="gpu">Unknown</span></div>
      <div class="stat-line">Foveation: <span id="foveation">Off</span></div>
      <div class="stat-line">Input: <span id="input-mode">None</span></div>
    </div>

    <div id="url-bar">
      <input type="text" id="url-input" placeholder="Enter URL or search..." />
    </div>
  </div>

  <script type="module" src="/vr-browser.js"></script>
</body>
</html>
