version: '3.8'

services:
  # メインVRブラウザサービス — Dockerfile が dist/ をビルドして nginx で配信
  vr-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qui-browser-vr
    image: qui-browser-vr:2.0.0

    # ポートマッピング
    ports:
      - "8080:80"
      # - "8443:443"  # HTTPS用（SSL証明書がある場合）

    # 環境変数
    environment:
      - NODE_ENV=production
      - TZ=Asia/Tokyo

    # 再起動ポリシー
    restart: unless-stopped

    # ヘルスチェック
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # リソース制限
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # ネットワーク
    networks:
      - vr-browser-network

    # ログ設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ネットワーク定義
networks:
  vr-browser-network:
    driver: bridge
